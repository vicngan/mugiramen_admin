<!DOCTYPE html>
<html lang="vi" data-a11y-inline>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MUGI Admin</title>
<link rel="icon" type="image/svg+xml" href="site/assets/mugi-icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600&family=Shippori+Mincho:wght@500;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<link rel="stylesheet" href="site/assets/washi.css">
<script src="site/assets/a11y.js" defer></script>
<style>
  /* MUGI admin portal. Same Washi tokens as the public site, denser layout.
     The public site is served under site/ on this same address (a Netlify
     proxy, or tools/server.mjs locally), so the preview can be edited in
     place. Content is read and published through api/ (each publish is a git
     commit on the site's repo). Without the API the portal runs in demo mode:
     nothing leaves the browser. */
  .ws { --ok: #4d6a3a; --warn: #85601f; --sidebar: 240px; }
  .ws .ad { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }

  /* sidebar */
  .ws .side-nav { background: var(--ink); color: var(--paper2); display: flex; flex-direction: column; padding: 22px 16px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .ws .side-nav .brand { padding: 0 8px 18px; border-bottom: 1px solid #4a3d33; margin-bottom: 14px; }
  .ws .side-nav .brand b { color: var(--paper); }
  .ws .side-nav .brand small { display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #b9ab94; }
  .ws .snav { display: flex; flex-direction: column; gap: 2px; }
  .ws .snav button { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 0 10px; background: none; border: 0; border-left: 2px solid transparent; color: #cfc3ae; font: 500 14px var(--sans); text-align: left; cursor: pointer; }
  .ws .snav button:hover { color: #fff; }
  .ws .snav button.on { color: #fff; border-left-color: var(--gold); background: rgba(255,255,255,.05); }
  .ws .snav .k { font-family: var(--mincho); color: #8f816c; font-size: 12px; margin-right: 8px; }
  .ws .badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; }
  .ws .badge.gold { background: var(--gold); }
  .ws .side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid #4a3d33; }
  .ws .me { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: var(--paper); cursor: pointer; padding: 6px 8px; min-height: 48px; text-align: left; font: 500 14px var(--sans); }
  .ws .me:hover, .ws .me.on { background: rgba(255,255,255,.06); }
  .ws .me .av { width: 32px; height: 32px; font-size: 14px; background: #3a2e26; border-color: #5a4b3e; color: #e3c9a0; flex: 0 0 auto; }
  .ws .me .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* main */
  .ws .main { padding: clamp(14px, 2vw, 26px) clamp(16px, 3.5vw, 48px) 80px; min-width: 0; }
  .ws .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--ink); margin-bottom: 24px; }
  .ws .head h1 { font-size: clamp(26px, 2.6vw, 34px); margin: 4px 0 0; text-wrap: balance; }
  .ws .head .sub { margin-top: 6px; font-size: 14px; }
  .ws .head .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .ws .cta.sm { min-height: 40px; font-size: 13px; padding: 0 16px; }
  .ws .cta[disabled] { opacity: .45; cursor: not-allowed; }
  .ws .linkbtn { background: none; border: 0; border-bottom: 1px solid var(--ink); font: 500 13px var(--sans); color: var(--ink); cursor: pointer; padding: 0; min-height: 32px; }
  .ws .linkbtn:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .ws .muted { color: var(--muted); }
  .ws .num-t { font-variant-numeric: tabular-nums; }

  /* stat tiles */
  .ws .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin-bottom: 36px; }
  .ws .tile { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 20px; background: var(--card); display: flex; flex-direction: column; min-height: 156px; }
  .ws .tile .lbl { font-size: 12px; color: var(--muted); }
  .ws .tile .v { font-family: var(--mincho); font-size: 40px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ws .tile .v.red { color: var(--accent); }
  .ws .tile .hint { font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 10px; line-height: 1.5; }
  .ws .cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 36px; }
  .ws .blk h2 { font-size: 22px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .ws .blk h2 button { font: 500 13px var(--sans); background: none; border: 0; border-bottom: 1px solid var(--ink); cursor: pointer; color: var(--ink); padding: 0; }
  .ws .mini { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ws .mini .t { font-family: var(--mincho); font-size: 18px; }
  .ws .mini small { display: block; color: var(--muted); font-size: 12px; }
  .ws .mini img { width: 56px; height: 42px; object-fit: cover; }

  /* status chips */
  .ws .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 10px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.6; }
  .ws .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ws .st.new { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ws .st.new::before { background: #fff; }
  .ws .st.confirmed, .ws .st.published { color: var(--ok); }
  .ws .st.cancelled, .ws .st.hidden { color: #7d7064; }
  .ws .st.noshow, .ws .st.expired, .ws .st.changed { color: var(--warn); }
  .ws .st.draft { color: var(--ink); border-style: dashed; }

  /* filters */
  .ws .filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .ws .frow { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
  .ws .frow .row { margin-left: auto; }
  .ws .daynav { display: flex; align-items: center; gap: 4px; }
  .ws .daynav button { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; color: var(--ink); }
  .ws .daynav .day { font-family: var(--mincho); font-size: 22px; padding: 0 12px; min-width: 200px; }
  .ws .daynav .today { font: 500 13px var(--sans); width: auto; padding: 0 12px; }
  .ws .pill { min-height: 38px; font-size: 13px; padding: 0 14px; }
  .ws .pill .c { color: var(--muted); margin-left: 6px; font-size: 12px; }
  .ws .pill.on .c { color: #cfc3ae; }

  /* reservations table */
  .ws .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ws .tbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--ink); }
  .ws .tbl td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .ws .tbl tbody tr { cursor: pointer; }
  .ws .tbl tbody tr:hover { background: var(--card); }
  .ws .tbl .time { font-family: var(--mincho); font-size: 18px; }
  .ws .tbl .g b { font-weight: 500; display: block; }
  .ws .tbl .g small { color: var(--muted); }
  .ws .tbl .ppl { font-family: var(--mincho); font-size: 18px; }
  .ws .tbl .note-i { color: var(--warn); font-size: 12px; }
  .ws .qa { display: flex; gap: 6px; justify-content: flex-end; }
  .ws .qa button { min-height: 34px; padding: 0 10px; font: 500 12px var(--sans); border: 1px solid var(--line); background: var(--card); cursor: pointer; color: var(--ink); }
  .ws .qa button:hover { border-color: var(--ink); }
  .ws .qa button.go { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .ws .emptyrow { padding: 48px 0; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line); }

  /* drawer + modal */
  .ws .scrim { position: fixed; inset: 0; background: rgba(43,33,27,.4); z-index: 60; animation: scrimIn .25s ease both; }
  .ws .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); z-index: 61; border-left: 1px solid var(--ink); display: flex; flex-direction: column; animation: wsSlide .25s ease; }
  .ws .drawer .dh { padding: 22px 24px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .ws .drawer .dh h2 { font-size: 26px; }
  .ws .x { background: none; border: 0; font-size: 26px; line-height: 1; width: 44px; height: 44px; cursor: pointer; color: var(--ink); flex: 0 0 auto; }
  .ws .drawer .db { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .ws .drawer .df { padding: 16px 24px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ws .drawer .df .cta { min-height: 44px; font-size: 13px; padding: 0 8px; }
  .ws .callrow { display: flex; gap: 8px; margin: 4px 0 20px; }
  .ws .callrow a { flex: 1; text-align: center; border: 1px solid var(--line); background: var(--card); min-height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; }
  .ws .hist { font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 14px; margin-top: 8px; }
  .ws .hist p { margin: 0 0 6px; }
  .ws .dlg { position: fixed; z-index: 71; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: var(--paper); border: 1px solid var(--ink); display: flex; flex-direction: column; animation: dlgIn .34s cubic-bezier(.2, .8, .2, 1) both; box-shadow: 0 24px 60px rgba(43,33,27,.22); }
  /* dialogs rise into place; `out` plays on close */
  @keyframes dlgIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.98); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes dlgOut { to { opacity: 0; transform: translate(-50%, -48%) scale(.985); } }
  @keyframes scrimIn { from { opacity: 0; } }
  @keyframes scrimOut { to { opacity: 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
  .ws .dlg.out { animation: dlgOut .18s ease-in both; }
  .ws .scrim.out { animation: scrimOut .18s ease-in both; }
  .ws .dlg .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 24px 12px; border-bottom: 1px solid var(--line); }
  .ws .dlg .dh h2 { font-size: 26px; }
  .ws .dlg .db { padding: 16px 24px; overflow-y: auto; }
  .ws .dlg .df { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .ws .scrim.top { z-index: 70; }

  /* aligned lists: every row uses the same column template */
  .ws .grid-list { border-top: 1px solid var(--line); }
  .ws .grid-list .gh, .ws .grid-list .gr { display: grid; grid-template-columns: var(--cols); gap: 18px; align-items: center; }
  .ws .grid-list .gh { font-size: 12px; color: var(--muted); padding: 10px 0 8px; border-bottom: 1px solid var(--ink); }
  .ws .grid-list .gr { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ws .grid-list .gr > * { min-width: 0; }
  .ws .posts { --cols: 96px minmax(0, 1fr) 130px 120px 150px; }
  .ws .jobs { --cols: minmax(0, 1fr) 150px 130px 120px 150px; }
  .ws .apps { --cols: 44px minmax(0, 1fr) minmax(0, 1fr) 100px 120px; }
  .ws .users { --cols: 44px minmax(0, 1.4fr) 180px minmax(0, 1fr) 150px; }
  .ws .gr img, .ws .gr .noimg { width: 96px; height: 72px; object-fit: cover; background: var(--paper2); }
  .ws .gr h3 { font-family: var(--mincho); font-size: 18px; margin: 2px 0 2px; line-height: 1.3; font-weight: 500; }
  .ws .gr .meta { font-size: 12px; color: var(--muted); }
  .ws .gr b { font-weight: 500; display: block; }
  .ws .gr small { color: var(--muted); font-size: 12px; }
  .ws .kind { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  .ws .langs { display: flex; gap: 4px; }
  .ws .langs span { font-size: 11px; font-weight: 600; width: 26px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); color: #a39583; }
  .ws .langs span.ok { border-color: var(--ink); color: var(--ink); }
  .ws .rowacts { display: flex; gap: 4px; justify-content: flex-start; flex-wrap: wrap; }
  .ws .rowacts button { background: none; border: 0; border-bottom: 1px solid var(--line); font: 500 13px var(--sans); color: var(--ink); cursor: pointer; min-height: 36px; padding: 0 6px; }
  .ws .rowacts button:hover { border-bottom-color: var(--accent); color: var(--accent); }
  .ws .rowacts button.danger { color: var(--accent); }
  .ws .av { width: 40px; height: 40px; border-radius: 50%; background: var(--paper2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--mincho); font-size: 16px; color: var(--accent); }
  .ws .role { font-size: 12px; border: 1px solid var(--line); padding: 2px 10px; display: inline-block; white-space: nowrap; }
  .ws .role.owner { border-color: var(--accent); color: var(--accent); }
  .ws .notice { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 14px 18px; font-size: 14px; color: var(--muted); margin-bottom: 22px; }
  .ws .notice b { color: var(--ink); font-weight: 600; }

  /* post / job editor */
  .ws .editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 3vw, 48px); align-items: start; }
  .ws .seg { display: inline-flex; border: 1px solid var(--ink); flex-wrap: wrap; }
  .ws .seg button { min-height: 38px; padding: 0 14px; background: none; border: 0; font: 500 13px var(--sans); cursor: pointer; color: var(--ink); }
  .ws .seg button + button { border-left: 1px solid var(--ink); }
  .ws .seg button.on, .ws .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .ws .ltabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .ws .ltabs button { background: none; border: 0; border-bottom: 2px solid transparent; min-height: 44px; font: 500 14px var(--sans); color: var(--muted); cursor: pointer; padding: 0 2px; }
  .ws .ltabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .ws .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 6px; vertical-align: middle; background: var(--line); }
  .ws .dot.ok { background: var(--ok); }
  .ws .stack { display: flex; flex-direction: column; gap: 22px; }
  .ws .count { font-size: 12px; color: var(--muted); text-align: right; }
  .ws .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .ws .chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink); cursor: pointer; }
  .ws .chk input { width: 18px; min-height: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
  .ws .actbar { position: sticky; bottom: 0; background: color-mix(in srgb, var(--paper) 96%, transparent); border-top: 1px solid var(--ink); padding: 14px 0; margin-top: 28px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5; }
  .ws .actbar .sp { flex: 1; }

  /* photo picker (posts, website images, menu photos) */
  .ws .photo { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: start; }
  .ws .photo .th { width: 120px; height: 90px; object-fit: cover; background: var(--paper2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-align: center; }
  .ws .photo .pf { display: flex; flex-direction: column; gap: 8px; }
  .ws .upl { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: var(--card); min-height: 36px; padding: 0 12px; font: 500 13px var(--sans); cursor: pointer; align-self: flex-start; }
  .ws .upl:hover { background: var(--ink); color: var(--paper); }
  .ws .upl input { display: none; }
  .ws .need { color: var(--accent); font-size: 12px; }
  .ws .poses { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .ws .poses button { min-height: 28px; padding: 0 8px; font: 500 12px var(--sans); border: 1px solid var(--line); background: none; cursor: pointer; color: var(--ink); }
  .ws .poses button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

  /* small preview of a post on the site */
  .ws .pvpane { position: sticky; top: 20px; }
  .ws .pvbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .ws .pvframe { border: 1px solid var(--ink); background: var(--paper); overflow: hidden; }
  .ws .pvchrome { display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: var(--paper2); border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .ws .pvchrome i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .ws .pvchrome span { margin-left: 8px; background: var(--card); padding: 1px 10px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ws .pvsite { padding: 0 20px 24px; }
  .ws .pvsite .pvnav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); gap: 12px; }
  .ws .pvsite .pvnav b { font-family: var(--mincho); letter-spacing: .3em; color: var(--accent); font-size: 15px; }
  .ws .pvsite .pvh { padding: 22px 0 16px; border-bottom: 1px solid var(--line); }
  .ws .pvsite .pvh h1 { font-size: 28px; margin-top: 4px; }
  .ws .pvsite .nrow { grid-template-columns: 80px minmax(0, 1fr); gap: 16px; padding: 18px 0; }
  .ws .pvsite .nrow h3 { font-size: 19px; }
  .ws .pvsite .nrow p { font-size: 14px; white-space: pre-line; }
  .ws .pvsite .nrow.old { opacity: .45; }
  .ws .pvsite .ph-t { color: #a39583; font-style: italic; }

  /* ── website editor ── */
  .ws .main.site { padding: 0; }
  .ws .site-top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--ink); background: var(--paper); position: sticky; top: 0; z-index: 20; }
  .ws .site-top h1 { font-size: 24px; margin: 0; margin-right: 8px; }
  .ws .site-top .sp { flex: 1; }
  .ws .ptabs { display: flex; gap: 0 18px; overflow-x: auto; }
  .ws .ptabs button { background: none; border: 0; border-bottom: 2px solid transparent; min-height: 40px; font: 500 14px var(--sans); color: var(--muted); cursor: pointer; padding: 0 2px; white-space: nowrap; }
  .ws .ptabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .ws .site-body { display: grid; grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); height: calc(100vh - 69px - 64px); }
  .ws .fields { overflow-y: auto; border-right: 1px solid var(--line); padding: 18px 22px 40px; display: block; }
  .ws .fsec2 { border-bottom: 1px solid var(--line); padding: 14px 0 18px; }
  .ws .fsec2 > h3 { font-family: var(--mincho); font-size: 19px; margin: 0 0 12px; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ws .fsec2 > h3 small { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 400; }
  .ws .fsec2 .stack { gap: 14px; }
  .ws .fl { display: flex; flex-direction: column; gap: 2px; scroll-margin-top: 20px; }
  .ws .fl > label, .ws .fl > .lab { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .ws .fl > label .chg, .ws .chg { color: var(--warn); font-weight: 600; }
  .ws .fl input, .ws .fl textarea, .ws .fl select { font-size: 15px; min-height: 40px; }
  .ws .fl textarea { min-height: 64px; }
  .ws .fl.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--gold) 22%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--gold) 22%, transparent); } 100% { background: transparent; box-shadow: 0 0 0 8px transparent; } }
  .ws .fallback { font-size: 12px; color: var(--muted); }
  .ws .hintbox { font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 4px; }

  .ws .pvwrap { display: flex; flex-direction: column; min-width: 0; background: var(--paper2); }
  .ws .pvtools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  /* settings */
  /* fixed frame: title and sub-tabs stay, only the panel scrolls; no page scroll or bounce */
  html, body { overscroll-behavior: none; }
  html:has(.main.fixed), html:has(.main.fixed) body, html:has(.main.site), html:has(.main.site) body { height: 100%; overflow: hidden; }
  .ws .ad:has(.main.fixed), .ws .ad:has(.main.site) { height: 100vh; height: 100dvh; min-height: 0; }
  /* Reservations only: a slimmer header and filter bar so more bookings fit on screen */
  .ws .main.res .head { padding-bottom: 12px; }
  .ws .main.res .daynav button { width: 38px; height: 38px; }
  .ws .main.res .daynav .today { height: 38px; }
  .ws .main.res .daynav .day { font-size: 19px; min-width: 170px; }
  .ws .main.res .pill { min-height: 34px; }
  .ws .main.res .filters { gap: 10px; }
  /* website editor: one screen; only the field list and the preview move */
  .ws .main.site { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .ws .main.site .site-top, .ws .main.site .changes { flex: 0 0 auto; position: static; }
  .ws .main.site .site-body { flex: 1 1 auto; min-height: 0; height: auto; }
  .ws .fields { overscroll-behavior: contain; }
  .ws .main.fixed { display: flex; flex-direction: column; overflow: hidden; min-height: 0; padding-bottom: 0; }
  .ws .main.fixed > * { flex: 0 0 auto; }
  .ws .main.fixed .head { margin-bottom: 20px; }
  .ws .main.fixed .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 48px; scrollbar-gutter: stable; }
  .ws .main.fixed .filters { margin-bottom: 8px; }
  /* column headers stay visible while the rows scroll under them */
  .ws .scroll .tbl thead th { position: sticky; top: 0; z-index: 1; background: var(--paper); border-bottom: 0; box-shadow: inset 0 -1px 0 var(--ink); }
  .ws .scroll .gh { position: sticky; top: 0; z-index: 1; background: var(--paper); }
  .ws .scroll .grid-list { border-top: 0; }
  .ws .main.fixed .setwrap { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
  .ws .main.fixed .setnav { align-self: start; position: static; padding-top: 4px; }
  .ws .main.fixed .setpanel { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 56px 0; scrollbar-gutter: stable; }
  .ws .head .sub { max-width: 64ch; }
  .ws .setwrap { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 44px; align-items: start; }
  .ws .setnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 20px; }
  .ws .setnav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: none; border: 0; border-left: 2px solid var(--line); min-height: 44px; padding: 0 14px; font: 500 14px var(--sans); color: var(--muted); cursor: pointer; }
  .ws .setnav button:hover { color: var(--ink); }
  .ws .setnav button.on { color: var(--ink); border-left-color: var(--accent); background: var(--card); }
  .ws .sblock { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 16px 44px; padding: 26px 0; border-bottom: 1px solid var(--line); }
  .ws .setpanel > .sblock:first-child { padding-top: 4px; }
  .ws .sblock.wide .sbh { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .ws .sbh h2 { font-size: 20px; }
  .ws .sbh p { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

  .ws .bnotify b { font-weight: 500; padding-bottom: 12px; }
  .ws .sdl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 14px; }

  .ws .livecard { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 15px; }

  .ws .vcol:first-child:hover::after, .ws .vcol:first-child:focus-visible::after { left: 0; transform: none; }

  .ws .vx { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; font-size: 11px; color: var(--muted); padding-top: 6px; }
  .ws .vx span { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ws .vx span:last-child { justify-self: end; }

const API = {
  async call(method, p, body) {
    let r;
    try { r = await fetch('api/' + p, { method, headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined }); }

      if (p !== 'status' && S.authed && !S.offline) { S.offline = true; renderOverlay(); updateChanges(); watchServer(); }
      throw new Error(t('offlineShort'));
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || r.statusText); e.errors = data.errors; throw e; }
    return data;
  },
  live: () => !!S.server,
};
async function boot() {
  try { S.server = await API.call('GET', 'status'); S.offline = false; S.loginErr = ''; } catch { S.server = null; }
  S.token = sessionStorage.getItem('mugi_token');

  if (S.token && !S.server) { S.offline = true; S.loginErr = t('offlineLogin'); render(); watchServer(); return; }

}
async function login(email, password) {
  // sign-in problems show inside the form (there is no toast area before signing in)
  S.loginErr = '';
  if (signups().some(x => x.email.toLowerCase() === email.toLowerCase())) { S.loginErr = t('pendingApproval'); render(); return; }
  try {
    if (S.server) {
      const r = await API.call('POST', 'login', { email, password });
      S.token = r.token; sessionStorage.setItem('mugi_token', r.token);
      S.content = await API.call('GET', 'content');
    } else {
      S.content = await fetch('site/content/site.json', { cache: 'no-cache' }).then(r => r.json());
    }
  } catch (e) { S.loginErr = e.message || 'Error'; render(); return; }
  S.me = { name: email.split('@')[0].replace(/^./, c => c.toUpperCase()), email };
  store.set('mugi_me', S.me);
  S.authed = true;
  afterLogin();
}

  if (!API.live()) { if (!S.content.news.length) S.content.news = clone(DEMO_NEWS); if (!S.content.jobs.length) S.content.jobs = clone(DEMO_JOBS); }
  const saved = store.get('mugi_site_draft');
  S.draft = saved && saved.base === hashOf(S.content) ? saved.draft : clone(S.content);
  S.view = isStaff() ? 'reservations' : 'overview';
  render();
}
const hashOf = c => { const s = JSON.stringify({ ...c, news: 0, jobs: 0 }); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; };

// One publish = one version (a git commit on the server). `files` are the new
// photos the content refers to.
async function publishContent(next, message) {
  const used = JSON.stringify(next);
  const files = Object.entries(S.pending).filter(([p]) => used.includes(p)).map(([path, f]) => ({ path, data: f.b64 }));
  let sha;
  if (API.live()) ({ sha } = await API.call('POST', 'publish', { content: next, files, message, authorName: S.me.name }));
  else {
    sha = Math.random().toString(16).slice(2, 9);
    S.demoHistory.unshift({ sha, author: S.me.name, date: new Date().toISOString(), message, content: clone(next) });
  }
  // Keep unpublished website edits, but take the newly published version as their base.
  const draftChanged = !same(stripPosts(S.draft), stripPosts(S.content));
  S.content = clone(next);
  if (draftChanged) { S.draft.news = clone(next.news); S.draft.jobs = clone(next.jobs); } else S.draft = clone(next);
  saveDraft();
  if (API.live()) for (const f of files) delete S.pending[f.path];
  return sha;
}
const stripPosts = c => ({ ...c, news: 0, jobs: 0 });
function saveDraft() {
  const dirty = !same(stripPosts(S.draft), stripPosts(S.content));
  store.set('mugi_site_draft', dirty ? { base: hashOf(S.content), draft: S.draft } : undefined);
}

// Resize in the browser (max 1600px, JPEG) so staff can upload straight from a phone.
function readPhoto(file, name) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.82);
      const slug = (name || 'photo').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'photo';
      const path = `assets/uploads/${slug}-${Date.now().toString(36)}.jpg`;
      S.pending[path] = { url, b64: url.split(',')[1] };
      URL.revokeObjectURL(img.src);
      ok(path);
    };
    img.onerror = () => fail(new Error('Could not read this photo'));
    img.src = URL.createObjectURL(file);
  });
}

function submitSignup() {
  const f = S.suForm = { name: document.getElementById('su-n').value.trim(), email: document.getElementById('su-e').value.trim(), branch: document.getElementById('su-b').value };
  const pw = document.getElementById('su-p').value;
  const taken = [...users, ...signups()].some(u => u.email.toLowerCase() === f.email.toLowerCase());
  S.suErr = !f.name ? t('suErrName') : !EMAIL_RE.test(f.email) ? t('suErrEmail') : pw.length < 8 ? t('suErrPw') : taken ? t('suErrTaken') : '';
  if (!S.suErr) {
    store.set('mugi_signups', [...signups(), { id: 's' + Date.now().toString(36), ...f, date: today() }]);
    S.authView = 'signupDone';
  }
  render();
  if (S.suErr) document.querySelector('#signup .err')?.focus?.();
}

        ${soon.length ? soon.map(p => `<div class="mini">${p.photo ? `<img src="${srcOf(p.photo)}" alt="">` : '<span></span>'}<div>${esc(p.title.vi)}<small>${t('untilD')} ${fmtShort(p.until)}</small></div><div class="rowacts"><button data-act="editPost" data-id="${p.id}">${t('edit')}</button></div></div>`).join('') : `<p class="muted">${t('nothing')}</p>`}

function saveMember() {
  const m = S.modal, d = m.data;
  d.name = d.name.trim(); d.email = d.email.trim();
  const errs = [];
  if (!d.name || !EMAIL_RE.test(d.email)) errs.push(t('needNameEmail'));
  if (m.isNew && users.some(u => u.email.toLowerCase() === d.email.toLowerCase())) errs.push(t('emailTaken'));
  const owners = users.filter(u => u.role === 'owner' && u.id !== d.id).length + (d.role === 'owner' ? 1 : 0);
  if (!owners) errs.push(t('lastOwner'));
  if (errs.length) { m.errors = errs; renderOverlay(); return; }
  if (d.role !== 'staff') d.branch = 'all';
  if (d.role === 'owner') d.perms = { ...ROLE_PERMS.owner };
  const i = users.findIndex(u => u.id === d.id);
  if (i >= 0) users[i] = d; else users.push(d);
  saveUsers();
  if (m.fromSignup) store.set('mugi_signups', signups().filter(x => x.id !== m.fromSignup));
  toast(m.fromSignup ? `${t('approvedT')} ${d.name}` : m.isNew ? `${t('invitedT')} ${d.email}` : t('saved'));
  closeModal();
}

function sampleTraffic(days) {
  return Array.from({ length: days }, (_, i) => {
    const d = dayAt(i - days + 1), dow = d.getDay();
    let v = 240 + ((d.getDate() * 37 + d.getMonth() * 11) % 17) * 9 + ([0, 5, 6].includes(dow) ? 150 : 0);
    if (i === days - 1) v = Math.round(v * 0.55); // today, so far
    return { date: iso(d), v };
  });
}

  const visitors = real ? real.visitors : data.reduce((a, d) => a + d.v, 0), views = real ? real.pageviews : Math.round(visitors * 2.7), clicks = real ? real.clicks : Math.round(visitors * 0.064);

      </div>
      <div class="vx" style="--n:${n}" aria-hidden="true">${data.map((d, i) => `<span>${(n - 1 - i) % every === 0 ? fmtShort(d.date) : ''}</span>`).join('')}</div>

  return sBlock(t('siteLive'), t('siteLiveD'), `<div class="livecard">${sv ? stChip('published', t('siteOnline')) : stChip('draft', t('modeDemo'))}<a href="https://${esc(settings.domain)}" target="_blank" rel="noopener">${esc(settings.domain)} ↗</a></div>

        ${sField('domain', t('domain'), 'text', 'placeholder="mugi.vn"')}`)
    + sBlock(t('traffic'), real ? t('trafficLive') : S[key]?.error ? t('trafficErr') : t('trafficD'), `
        <div class="tiles mtiles">
          <div class="tile"><div class="lbl">${t('visitorsL')}</div><div class="v">${fmtN(visitors)}</div></div>

}

/* change list: compare published content with the draft, grouped per thing */
function flat(o, pre = [], out = {}) {
  if (Array.isArray(o)) o.forEach((v, i) => flat(v, [...pre, (v && (v.id || v.key || v.slug)) || i], out));
  else if (o && typeof o === 'object') for (const k of Object.keys(o)) flat(o[k], [...pre, k], out);
  else out[JSON.stringify(pre)] = o ?? '';
  return out;
}
function siteChanges() {
  if (!S.draft || !S.content) return [];
  const a = flat(stripPosts(S.content)), b = flat(stripPosts(S.draft));
  const groups = new Map();
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
    if ((a[k] ?? '') === (b[k] ?? '')) continue;
    const p = JSON.parse(k);
    // group by the thing that changed: a text key, an image, or a menu item
    let gk = p.slice(0, 2), field = p.slice(2);
    const mi = p.findIndex(x => x === 'dishes' || x === 'items' || x === 'addOns');
    if (p[0] === 'menu' && mi > 0) { gk = p.slice(0, mi + 2); field = p.slice(mi + 2); }
    const id = JSON.stringify(gk);
    if (!groups.has(id)) groups.set(id, { gk, fields: [] });
    groups.get(id).fields.push({ field, before: a[k], after: b[k], inA: k in a, inB: k in b });
  }

    const before = getByKeys(stripPosts(S.content), g.gk), after = getByKeys(stripPosts(S.draft), g.gk);

  net.innerHTML = S.offline && S.authed ? `<div class="netbar" role="alert">${t('offlineBar')}</div>` : '';
  document.getElementById('ov-toast').innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast.msg)}${S.toast.undo ? `<button data-act="undo">${t('undo')}</button>` : ''}</div>` : '';
  // A dialog that is already open only swaps its inside, so its opening animation keeps running.
  const mc = document.getElementById('ov-modal'), open = mc.querySelector('.dlg:not(.out)');
  if (S.modal && open && shownModal === S.modal.type) {
    const tmp = document.createElement('div'); tmp.innerHTML = vModal();
    open.innerHTML = tmp.querySelector('.dlg').innerHTML;
  } else mc.innerHTML = S.modal ? vModal() : '';
  shownModal = S.modal ? S.modal.type : null;
  const v = document.getElementById('viewing');
  if (v) { v.hidden = !S.viewing; v.innerHTML = !S.viewing ? '' : S.viewing.post ? `${t('onlyYou')}<button data-act="backCurrent">${t('backEditor')}</button>` : `${t('viewingV')} <code>${esc(S.viewing.sha)}</code><button data-act="restore">${t('restore')}</button><button data-act="backCurrent">${t('backCurrent')}</button>`; }
}
let toastTimer;
function toast(msg, undo) {
  S.toast = { msg, undo }; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; document.querySelector('.toast')?.remove(); }, 4500);
  renderOverlay();
}

/* ── posts & jobs persistence ── */
const drafts = () => store.get('mugi_drafts', { news: [], jobs: [] });
function openEditor(kind, src) {
  const base = kind === 'job'
    ? { id: 'j' + Date.now().toString(36), status: 'draft', branch: 'all', kind: 'full', apply: 'form', updated: today(), title: blank(), body: blank() }
    : { id: 'n' + Date.now().toString(36), type: 'news', status: 'draft', photo: '', alt: blank(), from: today(), until: '', autoHide: true, updated: today(), author: S.me.name, title: blank(), body: blank() };
  S.edit = { kind, isNew: !src, data: src ? { ...base, ...clone(src), alt: { ...blank(), ...(src.alt || {}) } } : base };
  S.editLang = 'vi'; S.sel = null;
  window.scrollTo(0, 0);
}
async function savePost(status) {
  const { kind, data } = S.edit, list = kind === 'job' ? 'jobs' : 'news';
  if (status !== 'draft' && !data.title.vi.trim()) { toast(t('needTitle')); return false; }
  if (status === 'published' && data.photo && !(data.alt || {}).vi?.trim()) { toast(t('altNeed')); return false; }
  const item = { ...clone(data), status, updated: today() };
  const d = drafts();
  d[list] = (d[list] || []).filter(x => x.id !== item.id);
  if (status === 'draft') {
    d[list].unshift(item); store.set('mugi_drafts', d);
    // a published post saved as draft keeps its live version until republished
    S.edit.data = item; S.edit.isNew = false; toast(t('draftSaved')); return true;
  }
  store.set('mugi_drafts', d);
  const next = clone(S.content);
  const i = next[list].findIndex(x => x.id === item.id);
  if (i >= 0) next[list][i] = item; else next[list].unshift(item);
  try {
    const sha = await publishContent(next, `${kind === 'job' ? 'Careers' : 'News'}: ${status === 'published' ? 'publish' : 'hide'} “${item.title.vi}”`);
    toast(`${status === 'published' ? t('published') : t('hiddenT')} · ${sha}`);
    return true;
  } catch (e) { toast(t('pubFail') + ': ' + (e.errors || [e.message]).join('; ')); return false; }
}
async function setItemStatus(list, id, status) {
  const next = clone(S.content), it = next[list].find(x => x.id === id);
  if (!it) return;
  if (status === null) next[list] = next[list].filter(x => x.id !== id); else it.status = status;
  try {
    const sha = await publishContent(next, `${list === 'jobs' ? 'Careers' : 'News'}: ${status === null ? 'delete' : status === 'hidden' ? 'hide' : 'show'} “${it.title.vi}”`);
    toast(`${status === null ? t('deleted') : status === 'hidden' ? t('hiddenT') : t('published')} · ${sha}`);
  } catch (e) { toast(t('pubFail') + ': ' + e.message); }
  render();
}

/* ── menu edits ── */
function curItem() { return S.item ? getP(S.draft, itemPath(S.item)) : null; }
function newItemFor(ref) {
  const id = (ref.list === 'addOns' ? 'topping-' : 'item-') + Date.now().toString(36);
  if (ref.list === 'addOns') return { id, nameVi: '', nameEn: '', price: '' };
  const cat = S.draft.menu.categories.find(c => c.key === ref.cat);
  const sample = ref.list === 'dishes' ? cat.dishes[0] : cat.subgroups.find(s => s.id === ref.sub).items[0];
  // same template as its neighbours: sake keeps a size list, everything else a single price
  return sample && sample.sizes ? { id, nameVi: '', nameEn: '', desc: '', descVi: '', sizes: [{ label: '720ml', price: '' }] } : { id, nameVi: '', nameEn: '', nameJp: '', price: '', ...(ref.list === 'dishes' ? { photo: '' } : {}) };
}

/* ════════════════ events ════════════════ */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.closest('label.upl')) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (a === 'seen') { applications[+el.dataset.i].seen = true; setTimeout(render); return; }
  ev.preventDefault();
  switch (a) {
    case 'lang': S.lang = v; break;
    case 'a11y': window.mugiA11y?.toggle(el); return;
    case 'retryPreview': reloadFrame(); return;
    case 'forgot': S.loginEmail = document.getElementById('u').value.trim(); S.loginNote = !S.loginNote; S.loginErr = ''; break;
    case 'pw': { const i = document.getElementById(el.getAttribute('aria-controls')), show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.textContent = show ? t('pwHide') : t('pwShow'); el.setAttribute('aria-pressed', show); return; }
    case 'logout': S.authed = false; S.edit = null; S.sel = null; S.token = null; sessionStorage.removeItem('mugi_token'); app.innerHTML = ''; break;
    case 'go': S.view = v; S.edit = null; S.sel = null; S.viewing = null; if (el.dataset.st) S.status = el.dataset.st; if (el.dataset.tab) S.jobsTab = el.dataset.tab; if (el.dataset.tab2) S.setTab = el.dataset.tab2; window.scrollTo(0, 0); break;
    case 'day': S.day = v === '0' ? 0 : S.day + +v; S.sel = null; break;
    case 'branch': S.branch = v; break;
    case 'status': S.status = v; break;
    case 'open': S.sel = +id; renderOverlay(); return;
    case 'close': S.sel = null; renderOverlay(); return;
    case 'bst': {
      const b = bookings.find(x => x.id === +id), prev = b.status;
      b.status = v; S.lastUndo = () => { b.status = prev; };
      toast(`${b.name}: ${t('marked')} “${t('s_' + v)}”`, true); break;
    }
    case 'undo': S.lastUndo?.(); S.toast = null; break;
    case 'export': exportCsv(); toast(t('exported')); return;
    case 'pf': S.postFilter = v; break;
    case 'newPost': openEditor('post'); break;
    case 'editPost': S.view = 'news'; openEditor('post', allPosts().find(p => p.id === id)); break;
    case 'hidePost': await setItemStatus('news', id, 'hidden'); return;
    case 'showPost': await setItemStatus('news', id, 'published'); return;
    case 'delPost': case 'delJob': {
      const list = a === 'delPost' ? 'news' : 'jobs', d = drafts();
      if ((d[list] || []).some(x => x.id === id) && !S.content[list].some(x => x.id === id)) { d[list] = d[list].filter(x => x.id !== id); store.set('mugi_drafts', d); toast(t('deleted')); break; }
      await setItemStatus(list, id, null); return;
    }
    case 'jtab': S.jobsTab = v; break;
    case 'newJob': openEditor('job'); break;
    case 'editJob': S.view = 'careers'; openEditor('job', allJobs().find(j => j.id === id)); break;
    case 'hideJob': await setItemStatus('jobs', id, 'hidden'); return;
    case 'authView': S.authView = v; S.suErr = ''; S.loginErr = ''; if (v === 'signup') S.suForm = {}; break;
    case 'setTab': S.setTab = v; break;
    case 'statsRange': S.statsRange = +v; break;
    case 'changePw': { const n = document.getElementById('s-pw2').value; toast(n.length < 8 ? t('pwShort') : t('pwChanged')); return; }
    case 'a11ySize': { const st = window.mugiA11y.get(); st.size = +v; window.mugiA11y.set(st); break; }
    case 'inviteMember': S.modal = { type: 'member', isNew: true, data: { id: 'u' + Date.now().toString(36), name: '', email: '', role: 'staff', branch: BRANCHES[0].id, perms: { ...ROLE_PERMS.staff }, status: 'invited', last: 0 } }; renderOverlay(); setTimeout(() => document.getElementById('m-name')?.focus(), 60); return;
    case 'editMember': S.modal = { type: 'member', isNew: false, data: clone(users.find(u => u.id === id)) }; renderOverlay(); return;
    case 'approveSignup': { const x = signups().find(y => y.id === id); S.modal = { type: 'member', isNew: true, fromSignup: id, data: { id: 'u' + Date.now().toString(36), name: x.name, email: x.email, role: x.branch === 'office' ? 'manager' : 'staff', branch: x.branch === 'office' ? 'all' : x.branch, perms: { ...ROLE_PERMS[x.branch === 'office' ? 'manager' : 'staff'] }, status: 'active', last: 0 } }; renderOverlay(); return; }
    case 'declineSignup': store.set('mugi_signups', signups().filter(x => x.id !== id)); toast(t('declined')); break;
    case 'saveMember': saveMember(); return;
    case 'removeMember': S.modal.confirmRemove = true; renderOverlay(); return;
    case 'doRemoveMember': users = users.filter(u => u.id !== S.modal.data.id); saveUsers(); toast(t('removed2')); closeModal(); return;
    case 'addClosed': { const d = document.getElementById('s-closed').value; if (d && !settings.booking.closed.includes(d)) { settings.booking.closed.push(d); store.set('mugi_settings', settings); } break; }
    case 'delClosed': settings.booking.closed = settings.booking.closed.filter(d => d !== v); store.set('mugi_settings', settings); break;
    case 'openHistory': S.view = 'site'; render(); setTimeout(() => document.querySelector('[data-act=history]')?.click(), 80); return;
    case 'dlContent': { const a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([JSON.stringify(S.content, null, 2) + '\n'], { type: 'application/json' })); a2.download = 'site.json'; a2.click(); return; }
    case 'elang': S.editLang = v; break;
    case 'eset': S.edit.data[el.dataset.k] = v; break;
    case 'saveDraft': await savePost('draft'); break;
    case 'publishPost': if (await savePost('published')) { S.edit = null; } break;
    case 'unpub': if (await savePost('hidden')) S.edit = null; break;
    case 'postOnSite': {
      // open the real site preview with this post in it
      const { kind, data } = S.edit, list = kind === 'job' ? 'jobs' : 'news';
      const item = { ...clone(data), status: 'published' };
      S.viewing = { sha: t('onlyYou'), content: { ...clone(S.draft), [list]: [item, ...S.draft[list].filter(x => x.id !== item.id)] }, post: true };
      S.returnTo = { view: S.view, edit: S.edit };
      S.view = 'site'; S.page = kind === 'job' ? 'careers' : 'promotion'; S.edit = null; S.pick = false;
      render(); setTimeout(() => pushPreview(true), 400); return;
    }
    // website editor
    case 'page': S.page = v; S.checks = null; S.item = null; post({ type: 'mugi:tab', tab: v }); updateSite(); return;
    case 'slang': S.siteLang = v; post({ type: 'mugi:lang', lang: v }); updateSite(false); return;
    case 'device': S.device = v; updateSite(false); return;
    case 'pickmode': S.pick = v === '1'; updateSite(false); return;
    case 'checks': S.checks = S.checks ? null : runChecks(); updateSite(); return;
    case 'rerun': S.checks = runChecks(); updateSite(false); return;
    case 'showIssue': {
      const r = S.checks[+el.dataset.i];
      if (r.path) { jumpTo({ page: S.page, id: 'w-' + r.path.join('.') }); return; }
      frameDoc().querySelectorAll('.mugi-hit').forEach(x => x.classList.remove('mugi-hit'));
      r.el.classList.add('mugi-hit'); r.el.scrollIntoView({ block: 'center' }); return;
    }
    case 'setpos': setP(S.draft, JSON.parse(el.dataset.path), v); onDraftChange(); updateSite(false); return;
    case 'mbranch': S.menuBranch = v; post({ type: 'mugi:menu', loc: v, cat: S.openCat || 'ramen' }); updateSite(false); return;
    case 'openCat': S.openCat = S.openCat === v ? null : v; S.item = null; if (S.openCat) post({ type: 'mugi:menu', loc: S.menuBranch, cat: v }); updateSite(false); return;
    case 'openItem': { const ref = JSON.parse(el.dataset.ref); S.item = S.item && S.item.id === ref.id ? null : ref; S.delAsk = false; post({ type: 'mugi:menu', loc: S.menuBranch, cat: ref.cat }); updateSite(false); return; }
    case 'closeItem': S.item = null; updateSite(false); return;
    case 'addItem': {
      const ref = JSON.parse(el.dataset.ref), it = newItemFor(ref);
      const cat = S.draft.menu.categories.find(c => c.key === ref.cat);
      (ref.list === 'dishes' ? cat.dishes : ref.list === 'addOns' ? cat.addOns : cat.subgroups.find(s => s.id === ref.sub).items).push(it);
      S.item = { ...ref, id: it.id }; S.delAsk = false;
      onDraftChange(); updateSite(false);
      document.getElementById('w-item-' + it.id)?.nextElementSibling?.querySelector('input')?.focus();
      return;
    }
    case 'moveItem': {
      const p = itemPath(S.item), arr = getP(S.draft, p.slice(0, -1)), i = p[p.length - 1], j = i + +v;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]]; onDraftChange(); updateSite(false); return;
    }
    case 'askDel': S.delAsk = true; updateSite(false); return;
    case 'noDel': S.delAsk = false; updateSite(false); return;
    case 'delItem': { const p = itemPath(S.item); getP(S.draft, p.slice(0, -1)).splice(p[p.length - 1], 1); S.item = null; S.delAsk = false; onDraftChange(); updateSite(false); return; }
    case 'addSize': { const it = curItem(); it.sizes.push({ label: '', price: '' }); onDraftChange(); updateSite(false); return; }
    case 'delSize': { const it = curItem(); it.sizes.splice(+el.dataset.i, 1); onDraftChange(); updateSite(false); return; }
    case 'review': S.modal = { type: 'review' }; renderOverlay(); return;
    case 'discard': S.modal = { type: 'discard' }; renderOverlay(); return;
    case 'doDiscard': S.draft = clone(S.content); S.item = null; S.modal = null; saveDraft(); pushPreview(true); toast(t('discarded')); updateSite(false); return;
    case 'publishSite': {
      const pages = [...new Set(siteChanges().map(g => pageOf(g.gk)))].map(p => T.en['pg_' + p]);
      S.modal = { type: 'publish', message: `Website: ${pages.join(', ')} (${siteChanges().length} changes)` }; renderOverlay(); setTimeout(() => document.getElementById('pub-msg')?.focus(), 50); return;
    }
    case 'doPublish': {
      const m = S.modal; m.message = document.getElementById('pub-msg')?.value || m.message;
      const problems = validateSite(S.draft);
      if (problems.length) { m.errors = problems; renderOverlay(); return; }
      m.busy = true; m.errors = null; m.step = 0.5; renderOverlay();
      try {
        m.sha = await publishContent(clone(S.draft), m.message);
        m.step = 1; renderOverlay();
        await new Promise(r => setTimeout(r, 700)); m.step = 2; renderOverlay();
        await new Promise(r => setTimeout(r, 700)); m.step = 3; m.busy = false; renderOverlay();
        pushPreview(true); updateChanges();
      } catch (e) { m.step = 0; m.busy = false; m.errors = e.errors || [e.message]; renderOverlay(); }
      return;
    }
    case 'closeModal': if (S.modal?.busy) return; closeModal(); return;
    case 'history': {
      S.modal = { type: 'history', list: null }; renderOverlay();
      S.modal.list = API.live() ? await API.call('GET', 'history').catch(() => []) : S.demoHistory;
      renderOverlay(); return;
    }
    case 'viewVersion': {
      const sha = el.dataset.sha;
      const content = API.live() ? await API.call('GET', 'content?sha=' + sha) : S.demoHistory.find(h => h.sha === sha).content;
      S.viewing = { sha, content }; S.modal = null; renderOverlay(); pushPreview(true); return;
    }
    case 'backCurrent':
      if (S.viewing?.post && S.returnTo) { S.view = S.returnTo.view; S.edit = S.returnTo.edit; S.viewing = null; S.pick = true; S.returnTo = null; break; }
      S.viewing = null; renderOverlay(); pushPreview(true); return;
    case 'restore': {
      if (S.viewing?.post) { S.viewing = null; return; }
      try {
        // Restoring brings back the website text, photos and menu; news and jobs stay as they are now.
        const sha = API.live() ? (await API.call('POST', 'restore', { sha: S.viewing.sha })).sha : await publishContent({ ...clone(S.viewing.content), news: clone(S.content.news), jobs: clone(S.content.jobs) }, `Restore website content from ${S.viewing.sha}`);
        if (API.live()) { S.content = await API.call('GET', 'content'); S.draft = clone(S.content); saveDraft(); }
        S.viewing = null; toast(`${t('restored')} · ${sha}`); pushPreview(true); updateSite(false);
      } catch (e) { toast(t('pubFail') + ': ' + e.message); }
      return;
    }
    default: return;
  }
  render();
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'signup') { ev.preventDefault(); submitSignup(); return; }
  if (ev.target.id === 'login') { ev.preventDefault(); S.loginEmail = document.getElementById('u').value.trim(); login(document.getElementById('u').value.trim(), document.getElementById('p').value); }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.dataset.set) {
    const v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
    setSetting(el.dataset.set, v);
    if (el.dataset.set.startsWith('me.')) document.getElementById('nav').innerHTML = vNav();
    if (el.type !== 'checkbox') toast(t('saved'));
    return;
  }
  if (el.dataset.a11y) { const st = window.mugiA11y.get(); st[el.dataset.a11y] = el.checked; window.mugiA11y.set(st); return; }
  if (el.dataset.mrole && S.modal) { const d = S.modal.data; d.role = el.dataset.mrole; d.perms = { ...ROLE_PERMS[d.role] }; d.branch = d.role === 'staff' ? (d.branch === 'all' ? BRANCHES[0].id : d.branch) : 'all'; renderOverlay(); return; }
  if (el.dataset.mperm && S.modal) { S.modal.data.perms[el.dataset.mperm] = el.checked; return; }
  if (el.dataset.m && el.tagName === 'SELECT' && S.modal) { S.modal.data[el.dataset.m] = el.value; return; }
  if (el.dataset.act === 'role') {
    const [r, b] = el.value.split(':'); S.role = r; if (b) S.staffBranch = b;
    S.edit = null; S.sel = null; S.status = 'all'; S.view = r === 'staff' ? 'reservations' : 'overview'; render();
  } else if (el.dataset.act === 'vision') { S.vision = el.value; fitDevice();
  } else if (el.dataset.photo && el.files[0]) {
    const path = await readPhoto(el.files[0], el.dataset.name).catch(e => toast(e.message));
    if (!path) return;
    setP(S.draft, JSON.parse(el.dataset.photo), path); onDraftChange(); updateSite(false);
  } else if (el.dataset.postphoto && el.files[0]) {
    const path = await readPhoto(el.files[0], S.edit.data.title.en || S.edit.data.title.vi).catch(e => toast(e.message));
    if (path) { S.edit.data.photo = path; render(); }
  } else if (el.dataset.act === 'soldAt') {
    const it = curItem(), b = el.dataset.b; it.at ??= {};
    if (el.checked) { const { hidden, ...rest } = it.at[b] || {}; if (Object.keys(rest).length) it.at[b] = rest; else delete it.at[b]; }
    else it.at[b] = { ...(it.at[b] || {}), hidden: true };
    if (!Object.keys(it.at).length) delete it.at;
    onDraftChange(); updateSite(false);
  } else if (el.type === 'checkbox' && el.dataset.path) {
    const p = JSON.parse(el.dataset.path);
    if (el.checked) setP(S.draft, p, true); else delete getP(S.draft, p.slice(0, -1))[p[p.length - 1]];
    onDraftChange();
  } else if (el.dataset.bind === 'autoHide') { S.edit.data.autoHide = el.checked;
  } else if (el.tagName === 'SELECT' && el.dataset.bind) { S.edit.data[el.dataset.bind] = el.value; document.getElementById('pv').innerHTML = vPostPreview(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.m && S.modal && el.tagName === 'INPUT') { S.modal.data[el.dataset.m] = el.value; return; }
  if (el.dataset.path && el.type !== 'checkbox') { setP(S.draft, JSON.parse(el.dataset.path), el.value); onDraftChange(); return; }
  if (el.dataset.at) {
    const it = curItem(), b = el.dataset.at; it.at ??= {};
    const o = { ...(it.at[b] || {}) };
    if (el.value.trim()) o.price = el.value; else delete o.price;
    if (Object.keys(o).length) it.at[b] = o; else delete it.at[b];
    if (!Object.keys(it.at).length) delete it.at;
    onDraftChange(); return;
  }
  const k = el.dataset.bind;
  if (!k || !S.edit || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  if (k === 'title' || k === 'body' || k === 'alt') {
    S.edit.data[k] = S.edit.data[k] || blank();
    S.edit.data[k][S.editLang] = el.value;
    if (k === 'title') document.getElementById('c-title').textContent = el.value.length;
  } else S.edit.data[k] = el.value;
  document.getElementById('pv').innerHTML = vPostPreview();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.modal && !S.modal.busy) closeModal();
  else if (ev.key === 'Escape' && S.sel) { S.sel = null; renderOverlay(); }
});

function exportCsv() {
  const date = iso(dayAt(S.day));
  const rows = myBookings().filter(b => b.date === date && (isStaff() || S.branch === 'all' || b.branch === S.branch));
  const head = [t('date'), t('time'), t('branch'), t('guest'), t('phone'), t('ppl'), t('status'), t('confirmVia'), t('request')];
  const csv = [head, ...rows.map(b => [b.date, b.time, br(b.branch).short, b.name, b.phone, b.ppl, t('s_' + b.status), t('via_' + b.via), b.note])]
    .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `mugi-dat-ban-${date}.csv`; a.click();
}
